model_provider = "codexzh"

# 下面两项是否生效取决于客户端版本；默认注释避免兼容性问题
# network_access = "enabled"
# disable_response_storage = true

# =========================
# Shared Settings（通用配置）
# =========================
cache_size_mb = 512
cache_ttl = "30m"
smart_cache = true
cache_compression = true
notify = ["python", "C:\\Users\\zhangruojun\\.codex\\codex-notify.py"]
approvals_reviewer = "user"
personality = "pragmatic"
plan_mode_reasoning_effort = "low"
model = "gpt-5.5"
model_reasoning_effort = "low"

# =========================
# Providers（并存）
# =========================
[model_providers.codexzh]
name = "codexzh"
base_url = "https://api.codexzh.com/v1"
wire_api = "responses"
requires_openai_auth = true
web_search = "live"

[model_providers.newapi]
name = "CodeMaker"
base_url = "http://127.0.0.1:15721/v1"
wire_api = "responses"
requires_openai_auth = true
supports_websockets = false
model_context_window = 1000000
model_auto_compact_token_limit = 900000

[model_providers.duckcoding]
name = "OpenAI"
base_url = "https://api.duckcoding.ai/v1"
wire_api = "responses"
requires_openai_auth = true

[model_providers.teamorouter]
name = "teamorouter"
base_url = "https://api.teamorouter.com/v1"
requires_openai_auth = true
wire_api = "responses"

